<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Dhiker · Tasbih Counter</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#16140f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b35a30'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='IBM Plex Mono,monospace' font-weight='600' font-size='36' fill='white'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">D</div>
        <span class="brand-name">Dhiker</span>
      </div>
      <div class="topbar-right">
        <button class="pill-btn" id="themeBtn" aria-label="Toggle theme">☾</button>
        <button class="pill-btn" id="resetBtn" aria-label="Reset">↺ Reset</button>
      </div>
    </header>

    <main class="main">

      <div class="sequence" id="sequence"></div>

      <div class="center" id="center">
        <div class="arabic" id="arabic" dir="rtl" lang="ar"></div>
        <div class="dhikr-name" id="dhikrName"></div>
        <div class="dhikr-meaning" id="dhikrMeaning"></div>
        <div class="count" id="count">0</div>
        <div class="fraction">/ <span id="target">33</span></div>
      </div>

      <div class="beads" id="beads"></div>

    </main>

    <footer class="footer">
      <span class="tap-hint">Tap anywhere to count</span>
      <span class="sets-info" id="setsInfo"></span>
    </footer>

  </div>
  <script src="script.js"></script>
</body>
</html>
