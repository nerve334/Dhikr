<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Dhiker · Tasbih</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16140f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b35a30'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='IBM Plex Mono,monospace' font-weight='600' font-size='36' fill='white'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="bgA" class="bg-layer"></div>
  <div id="bgB" class="bg-layer"></div>
  <div class="bg-overlay"></div>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand__logo">D</div>
        <span class="brand__name">Dhiker</span>
        <span class="brand__sub">· tasbih</span>
      </div>

      <div class="topbar__right">
        <div class="date-chip" id="dateChip">—</div>

        <div class="theme-pill" role="tablist" aria-label="Theme">
          <button class="theme-pill__opt" data-theme-set="light" role="tab">light</button>
          <button class="theme-pill__opt" data-theme-set="dark"  role="tab">dark</button>
        </div>

        <button class="theme-icon" id="themeIcon" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main class="main">

      <section class="counter-card">
        <div class="counter-card__head">
          <span class="round-chip js-phase-chip">Step 1 of 3</span>
          <span class="sets-chip js-sets-chip">0 sets</span>
        </div>

        <div class="dhikr-label js-dhikr-name">Subhanallah</div>

        <div class="bignum js-count" aria-live="polite">0</div>

        <div class="dots js-dots" aria-hidden="true"></div>

        <div class="progress-bar">
          <div class="progress-bar__bar">
            <div class="progress-bar__fill js-fill"></div>
          </div>
          <div class="progress-bar__labels">
            <span class="js-pct-line">0 of 33</span>
            <span class="js-togo-line">33 to go</span>
          </div>
        </div>

        <div class="counter-card__controls">
          <button class="reset-pill js-reset">
            <span class="reset-pill__icon">↺</span> Reset
          </button>
          <div class="counter-card__buttons">
            <button class="icon-btn js-mode" aria-label="Switch mode">∞</button>
            <button class="icon-btn icon-btn--accent js-inc" aria-label="Increment">
              <span class="plus">+</span>
            </button>
          </div>
        </div>
      </section>

      <aside class="stats">
        <div class="stat-card">
          <div class="stat-card__label">Step</div>
          <div class="stat-card__value js-phase-val">1 / 3</div>
          <div class="stat-card__sub">of 3 dhikrs</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__label">Remaining</div>
          <div class="stat-card__value js-remaining">33</div>
          <div class="stat-card__sub">until next step</div>
        </div>
<div class="hint">
          Tap <kbd>+</kbd> to count, <kbd>−</kbd> to undo, <kbd>↺</kbd> to reset.
          Complete all 3 dhikrs to finish one set — then it loops automatically.
        </div>
      </aside>
    </main>

    <div class="mobile-controls-wrap">
      <div class="mobile-controls">
        <button class="icon-btn js-mode" aria-label="Switch mode">∞</button>
        <button class="icon-btn icon-btn--accent icon-btn--big js-inc" aria-label="Increment">
          <span class="plus">+</span>
        </button>
        <button class="icon-btn js-reset" aria-label="Reset">↺</button>
      </div>
      <div class="mobile-labels">
        <span>Mode</span>
        <span>Add</span>
        <span>Reset</span>
      </div>
    </div>

    <footer class="footer">
      <span>v2.0 · local only</span>
      <span class="session js-session">session · 00:00:00</span>
    </footer>

  </div>

  <script src="script.js?v=8"></script>
</body>
</html>
